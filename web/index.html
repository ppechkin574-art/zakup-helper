<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Госзакуп · Видеонаблюдение</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--ink:#14171f;--mut:#667085;--line:#e4e7ec;--acc:#1d5fd1;--good:#127a3e;--goodbg:#e7f6ec;--warn:#9a6200;--warnbg:#fff4dc;--bad:#b42318;--badbg:#fdecea;--sel:#eef4ff}
@media (prefers-color-scheme:dark){:root{--bg:#0f1115;--card:#171a21;--ink:#e8eaf0;--mut:#8b93a5;--line:#2a2f3a;--acc:#6ea0ff;--good:#4cc27a;--goodbg:#173523;--warn:#e0a63a;--warnbg:#3a2d12;--bad:#ff7a6e;--badbg:#3d1b18;--sel:#1c2638}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
header{display:flex;gap:12px;align-items:center;padding:12px 20px;border-bottom:1px solid var(--line);background:var(--card);position:sticky;top:0;z-index:5;flex-wrap:wrap}
h1{font-size:16px;margin:0 12px 0 0}
.mut{color:var(--mut)} .small{font-size:12px}
button,select,input{font:inherit;color:inherit}
button{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:6px 12px;cursor:pointer}
button.pri{background:var(--acc);border-color:var(--acc);color:#fff}
select,input{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:6px 8px}
input[type=number]{width:100%;text-align:right;font-variant-numeric:tabular-nums}
main{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(380px,1fr);height:calc(100vh - 58px)}
#list{overflow:auto;border-right:1px solid var(--line)}
#detail{overflow:auto;padding:20px}
table{width:100%;border-collapse:collapse}
th{position:sticky;top:0;background:var(--bg);text-align:left;font-weight:600;font-size:12px;color:var(--mut);padding:8px 10px;border-bottom:1px solid var(--line);cursor:pointer;white-space:nowrap}
td{padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
tr.row{cursor:pointer} tr.row:hover{background:var(--sel)} tr.row.on{background:var(--sel);box-shadow:inset 3px 0 var(--acc)}
.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.tag{display:inline-block;font-size:11px;padding:1px 7px;border-radius:999px;background:var(--line);color:var(--ink);white-space:nowrap}
.new{background:var(--acc);color:#fff}
.v-good{background:var(--goodbg);color:var(--good)} .v-warn{background:var(--warnbg);color:var(--warn)} .v-bad{background:var(--badbg);color:var(--bad)}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:14px}
.card h3{margin:0 0 10px;font-size:13px;text-transform:uppercase;letter-spacing:.04em;color:var(--mut)}
.grid2{display:grid;grid-template-columns:1fr 150px;gap:6px 12px;align-items:center}
.kv{display:grid;grid-template-columns:150px 1fr;gap:4px 12px}
.big{font-size:22px;font-weight:700;font-variant-numeric:tabular-nums}
.res{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px}
.res>div{border-radius:10px;padding:10px;background:var(--bg)}
.spec{white-space:pre-wrap;font-size:12.5px;max-height:260px;overflow:auto;background:var(--bg);padding:10px;border-radius:8px}
a{color:var(--acc)}
.doc h2{font-size:18px;margin:0 0 8px}.doc h3{font-size:15px;margin:18px 0 6px;text-transform:none;letter-spacing:0;color:var(--ink)}.doc h4{margin:14px 0 4px}
.doc li{margin:3px 0}.doc code{background:var(--bg);padding:1px 5px;border-radius:4px;font-size:12px}
.bar{height:6px;border-radius:3px;background:var(--line);position:relative;margin-top:4px}
.bar i{position:absolute;top:0;height:6px;border-radius:3px;background:var(--acc)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;border-radius:0}.seg button.on{background:var(--acc);color:#fff}
@media (max-width:900px){main{grid-template-columns:1fr;height:auto}#list{max-height:55vh}}
</style>
</head>
<body>
<header>
  <h1>Госзакуп · Видеонаблюдение</h1>
  <select id="fCat"><option value="">Все категории</option><option>поставка</option><option>монтаж</option><option>ремонт</option><option>ТО</option><option>прочее</option><option value="шум">мусор (интернет и т.п.)</option></select>
  <select id="fReg"><option value="">Все регионы</option></select>
  <input id="fQ" placeholder="Поиск по названию / заказчику" style="width:220px">
  <label class="small"><input type="checkbox" id="fMin"> от 1 млн ₸</label>
  <span style="flex:1"></span>
  <span id="stat" class="small mut"></span>
  <button id="btnHelp">Как считается</button>
  <button id="btnSet">Настройки</button>
  <button class="pri" id="btnRef">Обновить</button>
</header>
<main>
  <div id="list"><table><thead><tr>
    <th data-k="end">Срок</th><th data-k="name">Лот</th><th data-k="region">Регион</th><th class="num" data-k="price">Сумма, ₸</th><th data-k="verdict">Оценка</th>
  </tr></thead><tbody id="tb"></tbody></table></div>
  <div id="detail"><p class="mut">Выберите лот слева.</p></div>
</main>
<script>
const $=s=>document.querySelector(s);
const fmt=n=>n==null||isNaN(n)?'—':Math.round(n).toLocaleString('ru-RU');
const pct=n=>n==null||isNaN(n)?'—':(n*100).toFixed(1)+'%';
const DEF={tax:'our',vat:0.16,kpn:0.20,simple:0.04,target:0.15,bidSec:0.01,perfSec:0.03,logistics:0.03,installPerCam:20000,bin:''};
let S=Object.assign({},DEF), LOTS=[], CUR=null, sortK='end', sortDir=1;

async function api(p,body){const r=await fetch(p,body?{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}:{});return r.json()}

function daysLeft(end){const d=(new Date(end)-Date.now())/864e5;return d}
function endLabel(end){const d=daysLeft(end);const t=new Date(end).toLocaleString('ru-RU',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'});
  return `${t}<div class="small ${d<1?'':'mut'}" style="${d<1?'color:var(--bad)':''}">${d<1?Math.max(0,Math.round(d*24))+' ч':Math.floor(d)+' дн'}</div>`}

// ---------- расчёт ----------
// сколько камер монтировать: только если лот с монтажом; из позиций сметы, иначе кол-во по лоту
function defaultCams(l,items){
  if(!l.install)return 0;
  const fromItems=(items||[]).filter(i=>i.is_camera).reduce((a,i)=>a+(+i.qty||0),0);
  if(fromItems)return fromItems;
  return /камер/i.test(l.name||'')?(l.qty||l.qty_api||0):0;
}
function defaultBid(l){const d=l.median_discount;return l.price*(1-(d!=null&&d>0?d:0.10))}
// расчёт лота: ручной, если вы его меняли; иначе — из автоподбора (docs/AUTOPICK.md)
function fromAuto(l){const a=l.auto;if(!a||!a.ok)return null;
  return {items:(a.items||[]).map(x=>({...x})),...(a.cams?{cams:a.cams}:{}),_auto:true}}
function effCalc(l){return l.calc||fromAuto(l)}
const TIER={'точная модель':'точная','похожая модель':'похожая','аналог по типу':'аналог'};
function compute(l,c){
  c=c||{};const bid=+c.bid||defaultBid(l);
  const qty=+c.qty||l.qty||l.qty_api||1;
  const items=c.items||[];
  const equip=items.length?items.reduce((a,i)=>a+(+i.cost||0)*(+i.qty||0),0):(+c.unitCost||0)*qty; // закупка (с НДС поставщика)
  const cams=c.cams!=null&&c.cams!==''?+c.cams:defaultCams(l,items);
  const labor=c.labor!=null&&c.labor!==''?+c.labor:cams*S.installPerCam;
  const other=(+c.materials||0)+labor+(+c.otherCost||0);
  const logi=c.logistics!=null&&c.logistics!==''?+c.logistics:equip*S.logistics;
  const supVat=c.supVat!==false;
  let net,tax,revNet,costNet;
  if(S.tax==='our'){
    revNet=bid/(1+S.vat);
    costNet=(supVat?equip/(1+S.vat):equip)+other+logi;
    const pre=revNet-costNet;tax=Math.max(0,pre*S.kpn);net=pre-tax;
  }else{
    revNet=bid;costNet=equip+other+logi;tax=bid*S.simple;net=bid-costNet-tax;
  }
  const margin=net/bid;
  // минимальная цена, при которой выходим на целевую маржу
  let minBid;
  if(S.tax==='our'){const k=(1-S.kpn);minBid=costNet/((1/(1+S.vat))-S.target/k)}
  else minBid=costNet/(1-S.simple-S.target);
  const needCash=equip+other+logi+bid*(S.bidSec+S.perfSec);
  const known=equip>0||other>0;
  const verdict=!known?null:margin>=S.target?'good':margin>=0.05?'warn':'bad';
  return {cams,labor,bid,qty,equip,other,logi,tax,net,margin,minBid,needCash,verdict,costNet,revNet}
}
const VLAB={good:'выгодно',warn:'на грани',bad:'невыгодно'};

// ---------- список ----------
function render(){
  const cat=$('#fCat').value,reg=$('#fReg').value,q=$('#fQ').value.toLowerCase(),min=$('#fMin').checked;
  let L=LOTS.filter(l=>(cat?l.category===cat:l.category!=='шум')&&(!reg||l.region.includes(reg))&&(!min||l.price>=1e6)
    &&(!q||(l.name+' '+l.announcement+' '+l.customer+' '+l.short).toLowerCase().includes(q)));
  L.forEach(l=>{const c=effCalc(l);l._r=compute(l,c);l._f=compute(l,{...(c||{}),bid:l.price})});
  L.sort((a,b)=>{const g=x=>sortK==='verdict'?({good:3,warn:2,bad:1}[x._r.verdict]||0):x[sortK]??'';const A=g(a),B=g(b);return (A>B?1:A<B?-1:0)*sortDir});
  const fresh=Date.now()/1000-86400;
  $('#tb').innerHTML=L.map(l=>`<tr class="row ${CUR&&CUR.id===l.id?'on':''}" data-id="${l.id}">
    <td>${endLabel(l.end)}</td>
    <td><b>${esc(l.name)}</b>${l.first_seen>fresh?' <span class="tag new">новый</span>':''}
      <div class="small mut">${esc(l.short||'')} · ${esc(l.method||'')} · <span class="tag">${l.category}</span></div>
      <div class="small mut">${esc((l.customer||'').slice(0,90))}</div></td>
    <td class="small">${esc(l.region.replace(/область/,'обл.'))}</td>
    <td class="num">${fmt(l.price)}${l.qty?`<div class="small mut">${l.qty} ${esc(l.unit||'')}</div>`:''}</td>
    <td>${l._r.verdict?`<span class="tag v-${l._r.verdict}">${VLAB[l._r.verdict]} ${pct(l._r.margin)}</span>
      <div class="small mut" style="margin-top:3px">${fmt(l._r.net)} ₸ при скидке ${pct(1-l._r.bid/l.price)}</div>
      <div class="small mut">без скидки: ${fmt(l._f.net)} ₸ (${pct(l._f.margin)})</div>
      <div class="small mut">${l.calc?'ручной расчёт':`авто · ${TIER[l.auto.tier]||''}${l.auto.rough?' · грубая':''}`}</div>`
      :`<span class="small mut" title="${esc((l.auto||{}).reason||'')}">нет оценки${l.auto&&l.auto.reason?': '+esc(l.auto.reason.slice(0,60)):''}</span>`}</td></tr>`).join('');
  $('#stat').textContent=`${L.length} лотов на ${fmt(L.reduce((s,l)=>s+l.price,0))} ₸`;
}
function esc(s){return String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}

// ---------- карточка лота ----------
async function open(id){
  const l=await api('/api/lot/'+id);CUR=l;render();
  const c=Object.assign({qty:l.qty||l.qty_api||1,supVat:true},effCalc(l)||{});ITEMS=(c.items||[]).map(x=>({...x}));
  const a=l.auto||{};
  const autoBox=l.calc?`<div class="small" style="margin-bottom:10px">Ручной расчёт. <button id="btnReset">Вернуть автоподбор</button></div>`
    :a.ok?`<div class="small" style="margin-bottom:10px;padding:8px 10px;border-radius:8px;background:var(--bg)">
      <b>Автоподбор:</b> ${esc(a.tier)}${a.rough?' · <span style="color:var(--warn)">грубая оценка</span>':''}
      ${(a.notes||[]).map(n=>`<div class="mut">• ${esc(n)}</div>`).join('')}
      <div class="mut">Любая правка ниже превращает расчёт в ручной — автоподбор его больше не трогает.</div></div>`
    :`<div class="small mut" style="margin-bottom:10px">Автоподбор не оценил лот: ${esc(a.reason||'ещё не запускался')}</div>`;
  const sp=(l.techspec||{}).spec||{};const files=(l.techspec||{}).files||[];
  const h=(l.history||[]).filter(Boolean)[0];
  $('#detail').innerHTML=`
  <div class="card">
    <div class="small mut">${esc(l.ann_number)} · лот ${esc(l.lot_number)} · ${esc(l.system)}</div>
    <div style="font-size:18px;font-weight:700;margin:4px 0">${esc(l.name)} <span class="mut" style="font-weight:400">${esc(l.short)}</span></div>
    <div>${esc(l.announcement)}</div>
    <div class="kv" style="margin-top:10px">
      <span class="mut">Заказчик</span><span>${esc(l.customer)} <span class="mut small">БИН ${esc(l.customer_bin)}</span></span>
      <span class="mut">Место</span><span>${esc(l.region)}</span>
      <span class="mut">Способ</span><span>${esc(l.method)} · ${esc(l.status)}</span>
      <span class="mut">Приём до</span><span>${new Date(l.end).toLocaleString('ru-RU')}</span>
      <span class="mut">Сумма лота</span><span><b>${fmt(l.price)} ₸</b>${l.qty?` · ${l.qty} ${esc(l.unit||'')} → ${fmt(l.price/l.qty)} ₸ за ед.`:''}</span>
      ${l.dumping_price?`<span class="mut">Демпинг ниже</span><span>${fmt(l.dumping_price)} ₸</span>`:''}
      ${sp.term?`<span class="mut">Срок поставки</span><span>${esc(sp.term)}</span>`:''}
    </div>
    <div style="margin-top:10px">${l.system==='ЭГЗ'?`<a href="https://old.goszakup.gov.kz/ru/announce/index/${l.ann_ext}" target="_blank">Открыть на портале ↗</a>`:`<span class="mut">Площадка ${esc(l.system)}: ищите № ${esc(l.ann_number)} на <a href="https://zakup.gov.kz" target="_blank">zakup.gov.kz</a> — документы там, через API не отдаются</span>`}
      ${files.map(f=>` · <a href="${f.url}" target="_blank">${esc(f.group)}</a>`).join('')}</div>
  </div>

  <div class="card"><h3>Расчёт рентабельности</h3>${autoBox}
    <div class="grid2">
      <span>Количество, ${esc(sp.unit||'ед.')}</span><input type="number" id="c_qty" value="${c.qty}">
      <span>Закупка за ед., ₸ <span class="small mut">(если не выбраны позиции ниже)</span></span><input type="number" id="c_unitCost" value="${c.unitCost||''}" placeholder="0">
      <span class="small"><label><input type="checkbox" id="c_supVat" ${c.supVat!==false?'checked':''}> поставщик с НДС</label></span><span></span>
      <span>Материалы (кабель, крепёж…), ₸</span><input type="number" id="c_materials" value="${c.materials||''}" placeholder="0">
      <span>Камер к монтажу <span class="small mut">(${l.install?'лот с монтажом':'лот без монтажа'}; пусто = авто)</span></span><input type="number" id="c_cams" value="${c.cams??''}" placeholder="авто">
      <span>Работы / монтаж, ₸ <span class="small mut">(пусто = камеры × ${fmt(S.installPerCam)})</span></span><input type="number" id="c_labor" value="${c.labor??''}" placeholder="авто">
      <span>Логистика, ₸ <span class="small mut">(пусто = ${pct(S.logistics)} от оборудования)</span></span><input type="number" id="c_logistics" value="${c.logistics??''}" placeholder="авто">
      <span>Прочее (командировки, проект), ₸</span><input type="number" id="c_otherCost" value="${c.otherCost||''}" placeholder="0">
      <span><b>Наша цена в заявке, ₸</b><div class="small mut">по умолчанию: сумма лота − типичная скидка победителей</div></span><input type="number" id="c_bid" value="${Math.round(c.bid||defaultBid(l))}">
    </div>
    <div id="items"></div>
    <div id="res"></div>
  </div>

  <div class="card"><h3>Подбор у поставщика · keeper.kz</h3>
    <div style="display:flex;gap:8px;margin-bottom:8px"><input id="supQ" placeholder="Модель или бренд, напр. DS-2CD1043" style="flex:1"><button id="supGo">Найти</button></div>
    <div id="sup" class="small mut">Подбираю…</div>
  </div>

  <div class="card"><h3>Как такие лоты выигрывают (договоры за 6 мес.)</h3>${histHtml(h,l)}</div>

  <div class="card"><h3>Техническая спецификация</h3>${sp.desc?`<div class="spec">${esc(sp.desc)}</div>`:sp.error?`<span class="mut">Не удалось прочитать: ${esc(sp.error)}</span>`:'<span class="mut">Ещё загружается или нет файла.</span>'}</div>`;
  ['qty','cams','unitCost','materials','labor','logistics','otherCost','bid','supVat'].forEach(k=>$('#c_'+k).addEventListener('input',recalc));
  recalc(true);renderItems();
  if($('#btnReset'))$('#btnReset').onclick=async()=>{await api('/api/calc/'+id,{reset:true});const L=LOTS.find(x=>x.id===id);if(L)L.calc=null;open(id)};
  $('#supGo').onclick=()=>supSearch($('#supQ').value);$('#supQ').onkeydown=e=>{if(e.key==='Enter')supSearch($('#supQ').value)};
  const m=await api('/api/match/'+id);if(CUR.id!==id)return;
  supRender(m.candidates,m.models.length?`Модели в техспеке: ${m.models.slice(0,8).join(', ')}`:'Модель в техспеке не указана — подобраны дешёвые в наличии по типу товара.');
}
let SUP=[];
function supRender(list,note){SUP=list;const need=+$('#c_qty').value||1;
  $('#sup').innerHTML=(note?`<div class="mut" style="margin-bottom:6px">${esc(note)}</div>`:'')+(list.length?`<table class="small"><tr><th></th><th>Товар</th><th class="num">Платина</th><th class="num">Остаток</th><th></th></tr>${list.map((p,i)=>`<tr>
    <td>${p.image?`<img src="${p.image}" style="width:36px;height:36px;object-fit:contain;border-radius:6px;background:#fff">`:''}</td>
    <td><b>${esc(p.name)}</b><div class="mut">${esc(p.brand||'')} · арт. ${p.article} · ${esc(p.why)}</div></td>
    <td class="num">${fmt(p.cost)}${p.cost_src!=='платина'?`<div style="color:var(--warn)">${esc(p.cost_src)}</div>`:p.price&&p.cost!==p.price?`<div class="mut">золото ${fmt(p.price)}</div>`:''}</td>
    <td class="num" style="color:${p.quantity>=need?'var(--good)':p.quantity>0?'var(--warn)':'var(--bad)'}">${p.quantity}</td>
    <td><button data-i="${i}">+ в расчёт</button></td></tr>`).join('')}</table>`:'<span class="mut">Ничего не найдено. Попробуйте поиск по модели.</span>');
  $('#sup').querySelectorAll('button[data-i]').forEach(b=>b.onclick=()=>{const p=SUP[+b.dataset.i];ITEMS.push({article:p.article,name:p.name,cost:p.cost,cost_src:p.cost_src,is_camera:p.is_camera,qty:+$('#c_qty').value||1,stock:p.quantity});renderItems();recalc()});
}
async function supSearch(q){if(!q.trim())return;$('#sup').textContent='Ищу…';supRender(await api('/api/supplier/search?q='+encodeURIComponent(q)),'')}
function renderItems(){
  $('#items').innerHTML=ITEMS.length?`<table class="small" style="margin-top:10px"><tr><th>Позиция поставщика</th><th class="num">Цена</th><th class="num" style="width:70px">Кол-во</th><th class="num">Сумма</th><th></th></tr>
  ${ITEMS.map((x,i)=>`<tr><td>${esc(x.name)}${x.is_camera?' <span class="tag">камера</span>':''}${x.cost_src&&x.cost_src!=='платина'?` <span class="tag v-warn">${esc(x.cost_src)}</span>`:''}${x.stock!=null&&x.stock<x.qty?` <span class="tag v-bad">на складе ${x.stock}</span>`:''}</td><td class="num">${fmt(x.cost)}</td>
  <td><input type="number" data-q="${i}" value="${x.qty}"></td><td class="num">${fmt(x.cost*x.qty)}</td><td><button data-d="${i}">✕</button></td></tr>`).join('')}</table>`:'';
  $('#items').querySelectorAll('input[data-q]').forEach(el=>{el.oninput=()=>{ITEMS[+el.dataset.q].qty=+el.value;recalc()};el.onchange=()=>renderItems()});
  $('#items').querySelectorAll('button[data-d]').forEach(b=>b.onclick=()=>{ITEMS.splice(+b.dataset.d,1);renderItems();recalc()});
}
let ITEMS=[];
function readCalc(){const c={items:ITEMS};['qty','cams','unitCost','materials','labor','logistics','otherCost','bid'].forEach(k=>{const v=$('#c_'+k).value;if(v!=='')c[k]=+v});c.supVat=$('#c_supVat').checked;return c}
let saveT;
function recalc(first){
  const c=readCalc(),r=compute(CUR,c),f=compute(CUR,{...c,bid:CUR.price});
  const cls=r.verdict?'v-'+r.verdict:'';
  $('#res').innerHTML=`<div class="res">
    <div class="${cls}"><div class="small">Чистая прибыль</div><div class="big">${fmt(r.net)} ₸</div><div class="small">${r.verdict?VLAB[r.verdict]:'введите себестоимость'}</div></div>
    <div><div class="small mut">Рентабельность</div><div class="big">${pct(r.margin)}</div><div class="small mut">цель ${pct(S.target)}</div></div>
    <div><div class="small mut">Мин. цена при цели</div><div class="big">${fmt(r.minBid)}</div><div class="small mut">${r.minBid>CUR.price?'выше суммы лота — не выйдет':'скидка до '+pct(1-r.minBid/CUR.price)}</div></div>
  </div>
  <div class="kv small" style="margin-top:10px">
    <span class="mut">Без скидки</span><span>если выиграть по полной сумме ${fmt(CUR.price)} ₸: прибыль <b>${fmt(f.net)} ₸</b> (${pct(f.margin)})</span>
    <span class="mut">Режим</span><span>${S.tax==='our'?`НДС ${pct(S.vat)} + КПН ${pct(S.kpn)}`:`упрощёнка ${pct(S.simple)} с оборота`}</span>
    <span class="mut">Выручка без НДС</span><span>${fmt(r.revNet)} ₸</span>
    <span class="mut">Расходы без НДС</span><span>${fmt(r.costNet)} ₸ (оборудование ${fmt(r.equip)}, логистика ${fmt(r.logi)}, монтаж ${fmt(r.labor)}${r.cams?` за ${r.cams} кам.`:''}, прочее ${fmt(r.other-r.labor)})</span>
    <span class="mut">Налог</span><span>${fmt(r.tax)} ₸</span>
    <span class="mut">Нужно денег на старте</span><span>${fmt(r.needCash)} ₸ <span class="mut">(закупка + обеспечения заявки ${pct(S.bidSec)} и договора ${pct(S.perfSec)})</span></span>
    ${CUR.dumping_price&&r.bid<CUR.dumping_price?`<span style="color:var(--bad)">Внимание</span><span style="color:var(--bad)">цена ниже порога демпинга ${fmt(CUR.dumping_price)} ₸</span>`:''}
  </div>`;
  if(first!==true){clearTimeout(saveT);saveT=setTimeout(async()=>{await api('/api/calc/'+CUR.id,c);const L=LOTS.find(x=>x.id===CUR.id);if(L)L.calc=c;render();const b=$('#detail .card:nth-child(2) > div.small');if(b&&!$('#btnReset')){b.outerHTML=`<div class="small" style="margin-bottom:10px">Ручной расчёт. <button id="btnReset">Вернуть автоподбор</button></div>`;$('#btnReset').onclick=async()=>{await api('/api/calc/'+CUR.id,{reset:true});if(L)L.calc=null;open(CUR.id)}}},500)}
}
function histHtml(h,l){
  if(!h)return '<span class="mut">Ещё собирается…</span>';
  const d=h.deals||[];
  return `<div class="kv">
    <span class="mut">Договоров по коду</span><span>${h.contracts_total} (с конкуренцией проверено ${h.competitive_checked})</span>
    <span class="mut">Типичная скидка</span><span><b>${pct(h.median_discount)}</b> <span class="mut small">(разброс ${pct(h.p25_discount)} – ${pct(h.p75_discount)})</span></span>
    <span class="mut">Кто выигрывает</span><span class="small">${h.top_suppliers.map(([n,c])=>`${esc(n)} — ${c}`).join('<br>')}</span>
  </div>
  ${d.length?`<details style="margin-top:8px"><summary class="small">Последние сделки (${d.length})</summary><table class="small"><tr><th>Дата</th><th class="num">План</th><th class="num">Договор</th><th class="num">Скидка</th><th>Победитель</th></tr>
  ${d.map(x=>`<tr><td>${x.sign_date}</td><td class="num">${fmt(x.plan)}</td><td class="num">${fmt(x.price)}</td><td class="num">${pct(x.discount)}</td><td>${esc(x.supplier)}</td></tr>`).join('')}</table></details>`:''}`;
}

async function load(){
  LOTS=await api('/api/lots');
  const regs=[...new Set(LOTS.map(l=>(l.region.split(',')[0]||'').trim()).filter(Boolean))].sort();
  const cur=$('#fReg').value;$('#fReg').innerHTML='<option value="">Все регионы</option>'+regs.map(r=>`<option ${r===cur?'selected':''}>${esc(r)}</option>`).join('');
  render();
}
async function poll(){
  const s=await api('/api/status');
  $('#btnRef').textContent=s.running?('⟳ '+s.stage):'Обновить';
  $('#btnRef').disabled=s.running;
  if(s.last)$('#btnRef').title='Последнее обновление: '+new Date(s.last.at*1000).toLocaleString('ru-RU');
  if(poll.was&&!s.running)load();poll.was=s.running;
}
$('#tb').onclick=e=>{const tr=e.target.closest('tr.row');if(tr)open(+tr.dataset.id)};

['#fCat','#fReg','#fQ','#fMin'].forEach(s=>$(s).addEventListener('input',render));

// мини-рендер markdown для справки (заголовки, списки, таблицы, жирный, код)
function mdToHtml(md){
  const inl=t=>esc(t).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/`([^`]+)`/g,'<code>$1</code>');
  let h='',list=false,tbl=false;
  for(const ln of md.split('\n')){
    if(/^\|/.test(ln)){if(/^\|[\s:-]+\|/.test(ln.replace(/[^|:\s-]/g,'x'))&&/^[|\s:-]+$/.test(ln))continue;
      const cells=ln.split('|').slice(1,-1).map(x=>inl(x.trim()));h+=(tbl?'':'<table class="small">')+'<tr>'+cells.map(c=>`<td>${c}</td>`).join('')+'</tr>';tbl=true;continue}
    if(tbl){h+='</table>';tbl=false}
    if(/^\s*[-*] /.test(ln)){h+=(list?'':'<ul>')+'<li>'+inl(ln.replace(/^\s*[-*] /,''))+'</li>';list=true;continue}
    if(list){h+='</ul>';list=false}
    const m=ln.match(/^(#{1,3}) (.*)/);
    if(m)h+=`<h${m[1].length+1}>${inl(m[2])}</h${m[1].length+1}>`;else if(ln.trim())h+=`<p>${inl(ln)}</p>`;
  }
  return h+(list?'</ul>':'')+(tbl?'</table>':'');
}
(async()=>{Object.assign(S,await api('/api/settings'));await load();poll();setInterval(poll,3000);setInterval(load,60000)})();
