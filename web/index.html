<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Госзакуп · Видеонаблюдение</title>
<style>
/* Палитра Apple (iOS/macOS system colors, вариант повышенной контрастности для текста на белом) */
:root{
  color-scheme:light;
  --bg:#F2F2F7;          /* systemGray6 — серый фон */
  --card:#FFFFFF;        /* белые плашки */
  --fill:#F2F2F7;        /* заливка внутри карточек */
  --ink:#000000;         /* label */
  --mut:#6C6C70;         /* secondaryLabel (контрастный) */
  --line:#E5E5EA;        /* systemGray5 — разделители */
  --line2:#D1D1D6;       /* systemGray4 — рамки полей */
  --acc:#007AFF;         /* systemBlue */
  --acc-ink:#0040DD;     /* systemBlue, текст/ссылки */
  --good:#248A3D; --goodbg:#E3F5E8;   /* systemGreen */
  --warn:#C93400; --warnbg:#FFEFD9;   /* systemOrange */
  --bad:#D70015;  --badbg:#FFE4E6;    /* systemRed */
  --sel:#E5F0FF;
  --shadow:0 0 0 1px rgba(0,0,0,.05),0 1px 2px rgba(0,0,0,.06),0 4px 14px rgba(0,0,0,.06);
  --r:14px;
}
*{box-sizing:border-box}
html,body{background:var(--bg)}
/* SF: основной текст — системный SF Pro (все начертания, Display на крупных размерах);
   жирные заголовки — SF UI Display Bold (установлен только жирным) */
body{margin:0;color:var(--ink);font:14px/1.45 -apple-system,BlinkMacSystemFont,"SF Pro Display","Helvetica Neue",Arial,sans-serif;
  -webkit-font-smoothing:antialiased;letter-spacing:-.005em;padding:12px;height:100vh;display:flex;flex-direction:column;gap:12px}
header{display:flex;gap:8px;align-items:center;padding:10px 12px;background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);flex-wrap:nowrap;flex:none;min-width:0}
header select{width:150px;flex:none} header .search{flex:1 1 160px;min-width:100px;max-width:300px;position:relative;display:flex}
header .search .ic{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--mut)}
header .search input{width:100%;padding-left:32px}
button{display:inline-flex;align-items:center;gap:6px}
th .ic{margin-right:5px;color:var(--mut)}
#stat{flex:none}
@media (max-width:1200px){header{flex-wrap:wrap}} header button,header label,#stat{white-space:nowrap}
h1,.big,.title{font-family:"SF UI Display",-apple-system,BlinkMacSystemFont,sans-serif}
h1{font-size:17px;font-weight:700;white-space:nowrap;margin:0 10px 0 4px;letter-spacing:-.01em}
.mut{color:var(--mut)} .small{font-size:12px}
button,select,input{font:inherit;color:inherit}
button{border:0;background:var(--fill);color:var(--acc-ink);border-radius:10px;padding:7px 14px;cursor:pointer;font-weight:500}
button:hover{background:var(--line)}
button.pri{background:var(--acc);color:#fff}
button.pri:hover{background:#0062CC}
button:disabled{opacity:1;background:var(--fill);color:var(--mut);cursor:default}
select,input{border:1px solid var(--line2);background:var(--card);border-radius:10px;padding:7px 10px;outline:none}
select:focus,input:focus{border-color:var(--acc);box-shadow:0 0 0 3px #CCE4FF}
input[type=checkbox]{accent-color:var(--acc);padding:0}
input[type=number]{width:100%;text-align:right;font-variant-numeric:tabular-nums}
main{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(400px,1fr);gap:12px;flex:1;min-height:0}
#list{overflow:auto;padding:2px 4px 12px 2px}
.sortbar{display:flex;gap:10px;align-items:center;margin:2px 0 10px 2px}
.sortbar .seg button{font-size:13px;padding:5px 10px}
#tb{display:flex;flex-direction:column;gap:10px}
/* B · плитка с цифрами */
.lot{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:16px;display:flex;flex-direction:column;gap:10px;cursor:pointer}
.lot:hover{box-shadow:0 0 0 1px #C7C7CC,0 1px 2px rgba(0,0,0,.06),0 4px 14px rgba(0,0,0,.06)}
.lot.on{box-shadow:0 0 0 2px var(--acc),0 4px 14px rgba(0,0,0,.06)}
.lot .top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.lot .title{font-weight:700;font-size:15px;line-height:1.3}
.lot .place{color:var(--mut);font-size:13px;display:inline-flex;gap:5px;align-items:center}
.lot .nums{display:grid;grid-template-columns:1fr 1fr;border-top:1px solid var(--line);padding-top:10px;gap:10px}
.lot .nums .k{font-size:12px;color:var(--mut);display:flex;gap:5px;align-items:center}
.lot .nums .sum{font-family:"SF UI Display",-apple-system,sans-serif;font-weight:700;font-size:17px;font-variant-numeric:tabular-nums;white-space:nowrap}
#detail{overflow:auto;padding:0 2px 12px}
#detail>p{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:24px;margin:0}
table{width:100%;border-collapse:collapse}
th{position:sticky;top:0;background:var(--card);text-align:left;font-weight:600;font-size:12px;color:var(--mut);padding:10px 12px;border-bottom:1px solid var(--line);cursor:pointer;white-space:nowrap;z-index:1}
td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top}
tr.row{cursor:pointer} tr.row:hover{background:var(--fill)} tr.row.on{background:var(--sel);box-shadow:inset 3px 0 var(--acc)}
.ic{display:inline-flex;width:1.15em;height:1.15em;vertical-align:-.2em;flex:none}.ic svg{width:100%;height:100%}
.clamp1,.clamp2{display:-webkit-box;-webkit-box-orient:vertical;overflow:hidden}
.clamp1{-webkit-line-clamp:1}.clamp2{-webkit-line-clamp:2}
.left{display:inline-flex;gap:5px;align-items:center;font-variant-numeric:tabular-nums;font-weight:500}
.left.urgent{color:var(--bad)}
.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.tag{display:inline-block;font-size:11px;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--fill);color:#3A3A3C;white-space:nowrap}
.new{background:var(--acc);color:#fff}
.v-good{background:var(--goodbg);color:var(--good)} .v-warn{background:var(--warnbg);color:var(--warn)} .v-bad{background:var(--badbg);color:var(--bad)}
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:18px;margin-bottom:12px}
.card h3{margin:0 0 12px;font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.04em;color:var(--mut)}
.grid2 .fl .ic{color:var(--acc);margin-right:7px}
.grid2{display:grid;grid-template-columns:1fr 160px;gap:8px 12px;align-items:center}
.kv{display:grid;grid-template-columns:170px minmax(0,1fr);gap:8px 12px}
.kv>span{overflow-wrap:anywhere}
/* раскрывашки: главное сверху, второстепенное — по кнопке */
details.more{border-top:1px solid var(--line);margin-top:12px;padding-top:2px}
#sup button{white-space:nowrap}
details.more>summary{font-size:14px;list-style:none;display:flex;align-items:center;gap:6px;color:var(--acc-ink);font-weight:500;padding:8px 0;cursor:pointer;user-select:none}
details.more>summary::-webkit-details-marker{display:none}
details.more>summary .chev{color:var(--acc-ink)}
details.more[open]>summary .chev{transform:rotate(180deg)}
details.more>summary .cnt{color:var(--mut);font-weight:400}
details.more>.in{padding:4px 0 6px}
details.more+details.more{margin-top:0}
.status{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:12px;font-size:13px}
.bidrow{display:grid;grid-template-columns:1fr 180px;gap:12px;align-items:center;margin-top:14px}
.warnline{display:flex;gap:6px;align-items:center;color:var(--bad);font-size:13px;margin-top:10px}
.keyfig{font-family:"SF UI Display",-apple-system,sans-serif;font-size:24px;font-weight:700;font-variant-numeric:tabular-nums}
.kv .k{color:var(--mut);display:inline-flex;gap:7px;align-items:flex-start}
.kv .k .ic{color:var(--acc);margin-top:.05em}
.card h3{display:flex;align-items:center;gap:7px}.card h3 .ic{color:var(--acc);width:1.35em;height:1.35em}
.big{font-size:22px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.res{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}
.rk{display:flex;gap:5px;align-items:center}
.res>div{border-radius:12px;padding:12px;background:var(--fill)}
.res>div.v-good{background:var(--goodbg)} .res>div.v-warn{background:var(--warnbg)} .res>div.v-bad{background:var(--badbg)}
.spec{white-space:pre-wrap;font-size:12.5px;max-height:280px;overflow:auto;background:var(--fill);padding:12px;border-radius:10px}
a{color:var(--acc-ink);text-decoration:none} a:hover{text-decoration:underline}
details summary{cursor:pointer;color:var(--acc-ink)}
.doc h2{font-size:20px;margin:0 0 10px}.doc h3{font-size:15px;margin:20px 0 6px;text-transform:none;letter-spacing:0;color:var(--ink)}.doc h4{margin:14px 0 4px}
.doc li{margin:3px 0}.doc code{background:var(--fill);padding:1px 5px;border-radius:5px;font-size:12px}
.doc table td{border-bottom:1px solid var(--line)}
.seg{display:inline-flex;background:var(--fill);border-radius:10px;padding:2px}
.seg button{background:transparent;color:var(--ink);border-radius:8px}.seg button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
/* панель параметров — поверх правой колонки, список слева виден и пересчитывается сразу */
main{position:relative}
#params{position:absolute;top:0;right:0;bottom:0;width:min(560px,100%);overflow:auto;background:var(--card);border-radius:var(--r);
  box-shadow:0 0 0 1px rgba(0,0,0,.06),0 8px 30px rgba(0,0,0,.14);padding:18px 20px;z-index:5}
#params .phead{display:flex;align-items:center;gap:10px;margin-bottom:6px}
#params h2{font:700 19px/1.2 "SF UI Display",-apple-system,sans-serif;margin:0;flex:1;display:flex;gap:8px;align-items:center}
#params h2 .ic{color:var(--acc)}
#pClose{background:none;padding:4px;color:var(--mut);font-size:20px}
.pgroup{border-top:1px solid var(--line);padding:12px 0 6px}
.pg{font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.04em;color:var(--mut);margin-bottom:8px}
.prow{display:grid;grid-template-columns:1fr 170px;gap:12px;align-items:center;padding:4px 0}
.pl{display:flex;align-items:center;gap:6px}
.pin{display:flex;align-items:center;gap:6px}.pin input{flex:1}.pin .u{width:62px;font-size:12px;color:var(--mut)}
.tip{position:relative;color:var(--mut);display:inline-flex;cursor:help;outline:none}
.tip:hover,.tip:focus{color:var(--acc)}
.tipbox{display:none;position:absolute;left:-8px;top:calc(100% + 6px);width:300px;background:#1C1C1E;color:#fff;font-size:12.5px;line-height:1.45;
  padding:10px 12px;border-radius:10px;box-shadow:0 6px 20px rgba(0,0,0,.25);z-index:10;font-weight:400}
.tip:hover .tipbox,.tip:focus .tipbox{display:block}
/* расчёт: B · полоса + D · получаем / тратим */
:root{--c-eq:#007AFF;--c-lab:#5856D6;--c-log:#32ADE6;--c-oth:#A2845E;--c-tax:#8E8E93;--c-net:#34C759}
.t-good{color:var(--good)}.t-warn{color:var(--warn)}.t-bad{color:var(--bad)}
.huge{font-family:"SF UI Display",-apple-system,sans-serif;font-size:30px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.02em;line-height:1.15}
.rhead{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;margin-bottom:12px}
.stack{display:flex;height:30px;border-radius:9px;overflow:hidden;background:var(--fill);gap:1px}
.stack div{display:flex;align-items:center;justify-content:center;color:#fff;font-size:11px;font-weight:600;overflow:hidden;white-space:nowrap;min-width:0}
.ax{display:flex;justify-content:space-between;font-size:11.5px;color:var(--mut);margin:5px 0 4px;font-variant-numeric:tabular-nums}
.empty{background:var(--fill);border-radius:12px;padding:12px 14px;display:flex;gap:10px;align-items:center;color:#3A3A3C;font-size:13px}
.empty .ic{color:var(--warn);width:1.4em;height:1.4em}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:10px;margin-top:12px}
.col{background:var(--fill);border-radius:12px;padding:12px}
.ch{font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.04em;color:var(--mut);margin-bottom:8px;display:flex;justify-content:space-between}
.ch b{color:var(--ink);font-variant-numeric:tabular-nums;text-transform:none;letter-spacing:0;font-size:14px}
.col .s,.ln .s{display:block;font-size:11.5px;color:var(--mut);font-weight:400}
.bidin{font-weight:700;font-size:17px;margin:6px 0 8px}
.ln{display:grid;grid-template-columns:1fr 112px;gap:8px;align-items:center;padding:3px 0;font-size:13px}
.ln input{padding:5px 8px;font-size:13px}
.ln .ro{text-align:right;font-variant-numeric:tabular-nums;font-weight:600;padding-right:9px}
.dot{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:6px;vertical-align:.02em}
.foot{display:flex;gap:6px 18px;flex-wrap:wrap;margin-top:10px;font-size:12.5px}.foot>span{display:inline-flex;gap:5px;align-items:center}.foot .ic{color:var(--acc)}
.card h3 .r{margin-left:auto;text-transform:none;letter-spacing:0;font-weight:400;font-size:12.5px;color:var(--mut)}.card h3 .r b{color:var(--ink)}
/* поставщик: 2 · по позициям ТЗ + 1 · карточки товара */
.search{display:flex;gap:8px;margin:10px 0 8px}.search input{flex:1}
.grp{border:1px solid var(--line);border-radius:12px;margin-bottom:8px;overflow:hidden}
.grp .gh{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:8px 12px;background:var(--fill);font-size:13px}
.grp.miss{border-style:dashed}.grp .gh .s{display:block;font-size:11.5px;margin-top:2px}
.pc{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 12px;border-top:1px solid var(--line)}
.grp .gh+.pc{border-top:0}
#sup>.pc:first-child,#sup .in>.pc:first-child{border-top:0}
#sup .pc{padding-left:0;padding-right:0}
.thumb{width:44px;height:44px;border-radius:10px;background:var(--fill);display:flex;align-items:center;justify-content:center;color:#AEAEB2;overflow:hidden}
.thumb img{width:100%;height:100%;object-fit:contain;background:#fff}.thumb .ic{width:24px;height:24px}
.pn{font-weight:600;font-size:13px;line-height:1.3;overflow-wrap:anywhere}
.pc .meta{font-size:12px;color:var(--mut);display:flex;gap:4px 6px;flex-wrap:wrap;align-items:center;margin-top:3px}
.pr{text-align:right;display:flex;flex-direction:column;align-items:flex-end;gap:3px}
.pp{font-weight:700;font-size:15px;font-variant-numeric:tabular-nums;white-space:nowrap}
.mul{font-size:12px;color:var(--mut);font-variant-numeric:tabular-nums;white-space:nowrap}
.mul input{width:64px;padding:3px 6px;font-size:12px}
.stock{font-size:11.5px;font-weight:600;white-space:nowrap}
.acts{display:flex;gap:6px;margin-top:6px}.acts button,.pr button{padding:4px 10px;font-size:12.5px}
.grp .pc{align-items:start}.grp .thumb{margin-top:2px}
button.done{background:var(--goodbg);color:var(--good)}
.alts{background:#FAFAFC}.alts .pc{border-top:1px solid var(--line)}
.forline{display:flex;gap:8px;align-items:center;background:var(--sel);border-radius:10px;padding:6px 10px;font-size:13px;margin-bottom:6px}.forline button{margin-left:auto;padding:3px 8px}
.ghead{display:flex;align-items:center;gap:7px;font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.03em;margin:10px 2px 0}
.ghead:first-child{margin-top:0}.ghead span:last-child{margin-left:auto;font-weight:500;text-transform:none;letter-spacing:0;color:var(--mut)}
.ghead.g-good{color:var(--good)}.ghead.g-warn{color:var(--warn)}.ghead.g-bad{color:var(--bad)}.ghead.g-manual{color:#3A3A3C}
.grpline{display:flex;gap:6px 8px;flex-wrap:wrap;align-items:center;background:var(--fill);border-radius:10px;padding:8px 12px;margin:-4px 0 12px;font-size:13px}
.lot .why{display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:12.5px;color:var(--mut);margin-top:-4px}
@media (max-width:900px){body{height:auto}main{grid-template-columns:1fr}#list{max-height:60vh}}
</style>
</head>
<body>
<header>
  <h1>Госзакуп · Видеонаблюдение</h1>
  <select id="fCat"><option value="">Все категории</option><option>поставка</option><option>монтаж</option><option>ремонт</option><option>ТО</option><option>прочее</option><option value="шум">мусор и не наш товар</option></select>
  <select id="fReg"><option value="">Все регионы</option></select>
  <label class="search"><span data-ic="magnifer"></span><input id="fQ" placeholder="Поиск"></label>
  <label class="small"><input type="checkbox" id="fMin"> от 1 млн ₸</label>
  <span style="flex:1 1 0"></span>
  <span id="stat" class="small mut"></span>
  <button id="btnHelp"><span data-ic="question-circle"></span>Как считается</button>
  <button id="btnSet"><span data-ic="settings"></span>Параметры</button>
  <button class="pri" id="btnRef"><span data-ic="refresh"></span><span class="lbl">Обновить</span></button>
</header>
<main>
  <div id="list">
    <div class="sortbar"><span class="mut small">Сортировка</span>
      <div class="seg" id="sortSeg"><button data-k="end" class="on"><span data-ic="hourglass"></span>Срок</button><button data-k="price"><span data-ic="wallet-money"></span>Сумма</button><button data-k="verdict"><span data-ic="graph-up"></span>Выгода</button></div></div>
    <div id="tb"></div>
  </div>
  <div id="detail"><p class="mut">Выберите лот слева.</p></div>
  <aside id="params" hidden></aside>
</main>
<script>
// ICONS-START

const ic=(n,cls="")=>`<span class="ic ${cls}">${ICONS[n]||""}</span>`;
// ICONS-END
const $=s=>document.querySelector(s);
const fmt=n=>n==null||isNaN(n)?'—':Math.round(n).toLocaleString('ru-RU');
const pct=n=>n==null||isNaN(n)?'—':(n*100).toFixed(1)+'%';
// правила — docs/ECONOMICS.md
const DEF={tax:'simple',vat:0.16,kpn:0.20,simple:0.04,target:0.15,warnFrom:0.05,minProfit:50000,bidSec:0.01,perfSec:0.03,logistics:0.03,
  inst1:20000,instT1:10,inst2:18000,instT2:30,inst3:15000,toRate:'',discNoHist:0.10,minDeals:5,discSingle:0,bin:''};
// монтаж под ключ за камеру: ставка зависит от числа камер на объекте и применяется ко всем камерам
function instRate(n){return n>S.instT2?S.inst3:n>S.instT1?S.inst2:S.inst1}
function instTier(n){return n>S.instT2?`от ${S.instT2+1} камер`:n>S.instT1?`${S.instT1+1}–${S.instT2} камер`:`до ${S.instT1} камер`}
let S=Object.assign({},DEF), LOTS=[], CUR=null, sortK='end', sortDir=1;

async function api(p,body){const r=await fetch(p,body?{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}:{});return r.json()}

// сколько осталось до окончания приёма заявок — от текущего момента
function leftText(end){
  const ms=new Date(end)-Date.now();if(ms<=0)return 'завершён';
  const m=Math.floor(ms/6e4),d=Math.floor(m/1440),h=Math.floor(m%1440/60),mm=m%60;
  return d?`${d} д ${h} ч`:h?`${h} ч ${mm} мин`:`${mm} мин`;
}
function endLabel(end){const ms=new Date(end)-Date.now();
  return `<span class="left ${ms<864e5?'urgent':''}" data-end="${end}">${ic('clock-circle')} ${leftText(end)}</span>`}
// «Атырауская область, Курмангазинский район, с.Жумекен» → «Атырауская обл., с.Жумекен»
function place(addr){const p=(addr||'').split(',').map(x=>x.trim()).filter(Boolean);if(!p.length)return '';
  const reg=p[0].replace(/область/,'обл.');return p.length>1&&!/район/i.test(p[p.length-1])?`${reg}, ${p[p.length-1]}`:reg}

// ---------- расчёт ----------
// сколько камер монтировать: только если лот с монтажом; из позиций сметы, иначе кол-во по лоту
function defaultCams(l,items){
  if(!l.install)return 0;
  const fromItems=(items||[]).filter(i=>i.is_camera).reduce((a,i)=>a+(+i.qty||0),0);
  if(fromItems)return fromItems;
  return /камер/i.test(l.name||'')?(l.qty||l.qty_api||0):0;
}
// типичная скидка победителей (docs/ECONOMICS.md, 2.3): из одного источника → свой параметр;
// иначе медиана по тому же способу, если договоров хватает; иначе по коду; иначе — параметр «истории нет»
function lotDisc(l){
  if(/одного источника/i.test(l.method||''))return {d:S.discSingle,src:'из одного источника'};
  const m=l.disc_method;
  if(m&&m.median!=null&&m.n>=S.minDeals)return {d:m.median,src:`по способу «${l.method}», ${m.n} договоров`};
  if(l.disc_code!=null)return {d:l.disc_code,src:'по коду товара, все конкурентные способы'};
  return {d:S.discNoHist,src:'истории нет'};
}
function defaultBid(l){return l.price*(1-Math.max(0,lotDisc(l).d))}
// расчёт лота: ручной, если вы его меняли; иначе — из автоподбора (docs/AUTOPICK.md)
function fromAuto(l){const a=l.auto;if(!a||!a.ok)return null;
  return {items:(a.items||[]).map(x=>({...x})),...(a.cams?{cams:a.cams}:{}),_auto:true}}
function effCalc(l){return l.calc||fromAuto(l)}
const TIER={'точная модель':'точная','похожая модель':'похожая','аналог по типу':'аналог'};
function compute(l,c){
  c=c||{};const bid=+c.bid||defaultBid(l);
  const qty=+c.qty||l.qty||l.qty_api||1;
  const items=c.items||[];
  const equip=items.length?items.reduce((a,i)=>a+(+i.cost||0)*(+i.qty||0),0):(+c.unitCost||0)*qty; // закупка (с НДС поставщика)
  const cams=c.cams!=null&&c.cams!==''?+c.cams:defaultCams(l,items);
  // ТО: камеры × месяцы × ставка; пока ставка не задана — оценки нет
  const isTO=l.category==='ТО',months=+c.months||0;
  const toCost=isTO&&S.toRate!==''&&cams&&months?cams*months*(+S.toRate):0;
  const labor=c.labor!=null&&c.labor!==''?+c.labor:isTO?toCost:cams*instRate(cams);
  const other=(+c.materials||0)+labor+(+c.otherCost||0);
  const logi=c.logistics!=null&&c.logistics!==''?+c.logistics:equip*S.logistics;
  const supVat=c.supVat!==false;
  let net,tax,revNet,costNet;
  if(S.tax==='our'){
    revNet=bid/(1+S.vat);
    costNet=(supVat?equip/(1+S.vat):equip)+other+logi;
    const pre=revNet-costNet;tax=Math.max(0,pre*S.kpn);net=pre-tax;
  }else{
    revNet=bid;costNet=equip+other+logi;tax=bid*S.simple;net=bid-costNet-tax;
  }
  const margin=net/bid;
  // минимальная цена, при которой выходим на целевую маржу
  let minBid;
  if(S.tax==='our'){const k=(1-S.kpn);minBid=costNet/((1/(1+S.vat))-S.target/k)}
  else minBid=costNet/(1-S.simple-S.target);
  const needCash=equip+other+logi+bid*(S.bidSec+S.perfSec);
  const known=equip>0||other>0;
  const verdict=!known?null:net<(+S.minProfit||0)?'bad':margin>=S.target?'good':margin>=S.warnFrom?'warn':'bad';
  return {cams,months,isTO,labor,bid,qty,equip,other,logi,tax,net,margin,minBid,needCash,verdict,costNet,revNet}
}
const VLAB={good:'выгодно',warn:'на грани',bad:'невыгодно'};

// ---------- группы (docs/ECONOMICS.md, «Группы лотов») ----------
const GROUPS=[['good','Примерно выгодно','check-circle'],['warn','На грани','danger-triangle'],['bad','Примерно не выгодно','close-circle'],['manual','Посмотреть вручную','question-circle']];
function lotGroup(l){const f=l.flags||{},r=l._r||compute(l,effCalc(l)),a=l.auto||{};
  if(f.offtopic)return {g:'off',why:'не наш товар: '+(a.reason||'').replace(/^.*типа «(\S+)».*$/,(m,k)=>({'веб':'веб-камеры','ручная':'ручная видеокамера','авто':'автомобильный регистратор'}[k]||k))};
  if(!l.calc){ // ваш ручной расчёт важнее этих правил
    if(f.alarm)return {g:'manual',why:'автоподбор считает только камеры, сигнализацию — вручную'};
    if(l.category==='ТО')return {g:'manual',why:'обслуживание — считается вручную'};
  }
  if(r.verdict)return {g:r.verdict};
  if(f.no_docs)return {g:'manual',why:l.system==='SKK'?'ТЗ на портале Самрук-Қазына, сюда не скачивается':'к лоту нет документов'};
  if(f.scan)return {g:'manual',why:'ТЗ — скан без списка оборудования'};
  if(/типа «не определён»/.test(a.reason||''))return {g:'manual',why:`такого товара нет у поставщика${(a.models||[]).length?' (модель '+a.models.slice(0,2).join(', ')+')':''} — цену закупки вписать вручную`};
  return {g:'manual',why:!l.auto?'ещё обрабатывается — ТЗ и подбор появятся после обновления':a.reason||'нет себестоимости'};
}
function lotTags(l){const f=l.flags||{},a=l.auto||{},out=[];
  if(f.license)out.push(`<span class="tag v-bad">${ic('shield-warning')} нужна лицензия</span>`);
  if(f.alarm)out.push('<span class="tag v-warn">есть сигнализация</span>');
  return out.join('')}

// ---------- список ----------
function render(){
  const cat=$('#fCat').value,reg=$('#fReg').value,q=$('#fQ').value.toLowerCase(),min=$('#fMin').checked;
  LOTS.forEach(l=>{const c=effCalc(l);l._r=compute(l,c);l._grp=lotGroup(l)});
  let L=LOTS.filter(l=>(cat==='шум'?(l.category==='шум'||l._grp.g==='off'):(cat?l.category===cat:l.category!=='шум')&&l._grp.g!=='off')&&(!reg||(reg==='—'?!l.region:l.region.includes(reg)))&&(!min||l.price>=1e6)
    &&(!q||(l.name+' '+l.announcement+' '+l.customer+' '+l.short).toLowerCase().includes(q)));
  L.forEach(l=>{const c=effCalc(l);l._r=compute(l,c);l._f=compute(l,{...(c||{}),bid:l.price})});
  L.sort((a,b)=>{const g=x=>sortK==='verdict'?(x._r.verdict?x._r.margin:-1e9):x[sortK]??'';const A=g(a),B=g(b);return (A>B?1:A<B?-1:0)*sortDir});
  const fresh=Date.now()/1000-86400;
  const tile=l=>{const r=l._r,G=l._grp,v=G.g,addr=place((l.addresses||[])[0]||l.region);return `<div class="lot ${CUR&&CUR.id===l.id?'on':''}" data-id="${l.id}">
    <div class="top">${endLabel(l.end)}${['good','warn','bad'].includes(v)?`<span class="tag v-${v}">${VLAB[v]} ${pct(r.margin)}</span>`:v==='off'?'<span class="tag">не наш товар</span>':'<span class="tag">посмотреть</span>'}</div>
    <div class="title">${esc(l.name)}</div>
    ${G.why||lotTags(l)?`<div class="why">${lotTags(l)}${G.why?`<span>${esc(G.why)}</span>`:''}</div>`:''}
    <div class="place">${ic('map-point')}${addr?`${esc(addr)}${(l.addresses||[]).length>1?` <span>+${l.addresses.length-1}</span>`:''}`:'<span>регион не указан</span>'}</div>
    <div class="nums"><div><div class="k">${ic('wallet-money')}Сумма лота</div><div class="sum">${fmt(l.price)} ₸</div></div>
      <div><div class="k">${ic('graph-up')}Прибыль${v==='manual'&&r.verdict?' (черновик)':''}</div><div class="sum" style="color:${['good','warn','bad'].includes(v)?`var(--${v})`:'var(--mut)'}">${r.verdict?fmt(r.net)+' ₸':'—'}</div></div></div>
  </div>`};
  const by=g=>L.filter(l=>l._grp.g===g);
  $('#tb').innerHTML=cat==='шум'?L.map(tile).join(''):GROUPS.map(([g,title,icon])=>{const A=by(g);return A.length?`<div class="ghead g-${g}">${ic(icon)}${title}<span>${A.length} · ${fmt(A.reduce((s,l)=>s+l.price,0))} ₸</span></div>${A.map(tile).join('')}`:''}).join('');
  $('#stat').textContent=`${L.length} лотов на ${fmt(L.reduce((s,l)=>s+l.price,0))} ₸`;
}
function esc(s){return String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}

// ---------- карточка лота ----------
async function open(id){
  const l=await api('/api/lot/'+id);CUR=l;render();
  const c=Object.assign({qty:l.qty||l.qty_api||1,supVat:true},effCalc(l)||{});ITEMS=(c.items||[]).map(x=>({...x}));
  const a=l.auto||{};
  const sp=(l.techspec||{}).spec||{};const files=(l.techspec||{}).files||[];
  const h=(l.history||[]).filter(Boolean)[0];
  const notes=a.ok?(a.notes||[]):[];
  $('#detail').innerHTML=`
  <div class="card">
    <div class="title" style="font-size:19px;font-weight:700;margin:0 0 12px;line-height:1.3">${esc(l.name)}</div>
    ${(()=>{const G=lotGroup(l),tg=lotTags(l);return G.g==='manual'||G.g==='off'||tg?`<div class="grpline">${tg}${G.g==='manual'?'<b>Посмотреть вручную</b>':G.g==='off'?'<b>Не наш товар</b>':''}${G.why?`<span class="mut">${esc(G.why.replace(/^не наш товар: /,''))}</span>`:''}</div>`:''})()}

}

// мини-рендер markdown для справки (заголовки, списки, таблицы, жирный, код)
function mdToHtml(md){
  const inl=t=>esc(t).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/`([^`]+)`/g,'<code>$1</code>');
  let h='',list=false,tbl=false;
  for(const ln of md.split('\n')){
    if(/^\|/.test(ln)){if(/^\|[\s:-]+\|/.test(ln.replace(/[^|:\s-]/g,'x'))&&/^[|\s:-]+$/.test(ln))continue;
      const cells=ln.split('|').slice(1,-1).map(x=>inl(x.trim()));h+=(tbl?'':'<table class="small">')+'<tr>'+cells.map(c=>`<td>${c}</td>`).join('')+'</tr>';tbl=true;continue}
    if(tbl){h+='</table>';tbl=false}
    if(/^\s*[-*] /.test(ln)){h+=(list?'':'<ul>')+'<li>'+inl(ln.replace(/^\s*[-*] /,''))+'</li>';list=true;continue}
    if(list){h+='</ul>';list=false}
    const m=ln.match(/^(#{1,3}) (.*)/);
    if(m)h+=`<h${m[1].length+1}>${inl(m[2])}</h${m[1].length+1}>`;else if(ln.trim())h+=`<p>${inl(ln)}</p>`;
  }
  return h+(list?'</ul>':'')+(tbl?'</table>':'');
}
