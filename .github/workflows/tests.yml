# Автопроверка правил при каждом изменении (tests/). Каталог keeper.kz здесь не скачивается —
# проверки подбора по каталогу пропускаются, они идут на Mac. Сайт выкладывает Mac: publish.py (docs/DEPLOY.md).
name: Проверка правил

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 -m unittest discover tests -v
