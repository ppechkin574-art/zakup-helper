# Сайт на GitHub Pages: раз в час обновляет лоты, ТЗ, цены keeper.kz и выкладывает страницу (docs/DEPLOY.md)
name: Обновление сайта

on:
  schedule:
    - cron: "17 * * * *"      # каждый час в :17 (время UTC)
  workflow_dispatch:           # кнопка «Run workflow» на GitHub
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    # macOS: чтение Word-файлов ТЗ (textutil) есть только там
    runs-on: macos-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Есть ли ключ keeper.kz
        env:
          KEEPER_TOKEN: ${{ secrets.KEEPER_TOKEN }}
        run: |
          if [ -z "$KEEPER_TOKEN" ]; then
            echo "::error::Нет секрета KEEPER_TOKEN: Settings → Secrets and variables → Actions → New repository secret (docs/DEPLOY.md)"
            exit 1
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Программы для чтения ТЗ (PDF, сканы)
        run: |
          brew install poppler tesseract
          TD="$(brew --prefix)/share/tessdata"
          for l in rus kaz; do
            curl -sSL -o "$TD/$l.traineddata" "https://github.com/tesseract-ocr/tessdata_fast/raw/main/$l.traineddata"
          done

      # база между запусками: ТЗ, история цен и каталог не скачиваются каждый час заново
      - name: База с прошлого запуска
        uses: actions/cache/restore@v4
        with:
          path: data
          key: db-${{ github.run_id }}
          restore-keys: db-

      - name: Обновить данные и собрать сайт
        env:
          KEEPER_TOKEN: ${{ secrets.KEEPER_TOKEN }}
        run: |
          python3 -m unittest discover tests
          python3 build_static.py

      - name: Сохранить базу
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data
          key: db-${{ github.run_id }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
